server:
  port: ${SERVER_PORT:8082}
  forward-headers-strategy: none
spring:
  application:
    name: uno-game-service
  datasource:
    url: ${GAME_DB_URL}
    username: ${GAME_DB_USER:uno_game}
    password: ${GAME_DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 3000
      validation-timeout: 1000
  sql:
    init:
      mode: never
  flyway:
    clean-disabled: true
    validate-on-migrate: true
    baseline-on-migrate: false
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
        liveness:
          include: livenessState
uno:
  voice:
    enabled: ${TEAM_VOICE_ENABLED:false}
    server-url: ${LIVEKIT_SERVER_URL:http://127.0.0.1:7880}
    public-url: ${LIVEKIT_PUBLIC_URL:ws://127.0.0.1:7880}
    api-key: ${LIVEKIT_API_KEY:}
    api-secret: ${LIVEKIT_API_SECRET:}
    allow-insecure-http: ${TEAM_VOICE_ALLOW_HTTP:false}
  auth:
    enabled: ${GAME_AUTH_ENABLED:false}
    secure-cookies: ${AUTH_COOKIE_SECURE:true}
    allowed-origins: ${AUTH_ALLOWED_ORIGINS:}
    identity-base-url: ${IDENTITY_INTERNAL_URL:https://identity-service}
    service-key: ${IDENTITY_GAME_SERVICE_KEY:}
    allow-insecure-http: ${GAME_AUTH_ALLOW_HTTP:false}
    timeout-millis: 2000
