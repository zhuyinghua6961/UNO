name: Verify

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: node tools/sync-assets.mjs
      - run: npm --prefix web ci
      - run: npm --prefix web test
      - run: npm --prefix web run build

  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/**/pom.xml
      - run: mvn -B -f backend/pom.xml -Pdatabase-it clean verify

  stack-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: node tools/sync-assets.mjs
      - run: node tools/init-local-env.mjs
      - run: |
          docker compose -p uno-ci --env-file deploy/.env \
            -f deploy/compose.yaml -f deploy/compose.auth-local.yaml \
            up --build -d --wait --wait-timeout 180
      - run: EXPECT_AUTH_AVAILABLE=true EXPECT_GAME_AUTH_AVAILABLE=true node tools/smoke-api.mjs
      - run: SMOKE_FULL_MATCH=true SMOKE_TEAM_MATCH=true node tools/smoke-auth-chat.mjs
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run test:e2e:network
        working-directory: web
        env:
          UNO_E2E_ORIGIN: http://127.0.0.1:8088
          UNO_E2E_MAILPIT: http://127.0.0.1:28025
      - if: always()
        run: |
          docker compose -p uno-ci --env-file deploy/.env \
            -f deploy/compose.yaml -f deploy/compose.auth-local.yaml down

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: '3.47.0'
          cache: true
      - run: node tools/sync-assets.mjs
      - run: flutter pub get
        working-directory: flutter
      - run: dart analyze lib test integration_test
        working-directory: flutter
      - run: flutter test
        working-directory: flutter
      - run: flutter build apk --debug --no-pub --dart-define=API_BASE_URL=http://10.0.2.2:28080
        working-directory: flutter

  ios-simulator:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: '3.47.0'
          cache: true
      - run: xcodebuild -version
      - run: node tools/sync-assets.mjs
      - run: flutter pub get
        working-directory: flutter
      - run: flutter build ios --simulator --no-codesign --no-pub --dart-define=API_BASE_URL=http://127.0.0.1:28080 --dart-define=UNO_LOCAL_EPHEMERAL_SESSION=true
        working-directory: flutter
