name: uno-dev

services:
  identity-service:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
      args:
        SERVICE: identity-service
    environment:
      SERVER_PORT: 8081
      IDENTITY_DB_URL: jdbc:postgresql://postgres:5432/uno_identity
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?Run node tools/init-local-env.mjs first}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  game-service:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
      args:
        SERVICE: game-service
    environment:
      SERVER_PORT: 8082
      GAME_DB_URL: jdbc:postgresql://postgres:5432/uno_game
      GAME_DB_PASSWORD: ${GAME_DB_PASSWORD:?Run node tools/init-local-env.mjs first}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  gateway:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
      args:
        SERVICE: gateway
    environment:
      SERVER_PORT: 8080
      IDENTITY_URL: http://identity-service:8081
      GAME_URL: http://game-service:8082
      GAME_WS_URL: ws://game-service:8082
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-28080}:8080"
    depends_on:
      - identity-service
      - game-service
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    ports:
      - "127.0.0.1:${WEB_PORT:-8088}:80"
    depends_on:
      - gateway
    restart: unless-stopped

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    environment:
      POSTGRES_DB: uno
      POSTGRES_USER: uno
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run node tools/init-local-env.mjs first}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?Run node tools/init-local-env.mjs first}
      GAME_DB_PASSWORD: ${GAME_DB_PASSWORD:?Run node tools/init-local-env.mjs first}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U uno -d uno"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    profiles: [infrastructure]
    command: [redis-server, --appendonly, "yes"]
    volumes:
      - redis-data:/data

  livekit:
    image: livekit/livekit-server:v1.13.6
    profiles: [voice]
    command: [--config, /etc/livekit.yaml]
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:?Run node tools/init-local-env.mjs first}: ${LIVEKIT_API_SECRET:?Run node tools/init-local-env.mjs first}"
    ports:
      - "127.0.0.1:7880:7880"
      - "127.0.0.1:7881:7881/tcp"
      - "127.0.0.1:7882:7882/udp"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro

volumes:
  postgres-data:
  redis-data:
