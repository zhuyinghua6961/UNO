services:
  identity-service:
    environment:
      AUTH_ENABLED: "true"
      AUTH_COOKIE_SECURE: "false"
      AUTH_ALLOWED_ORIGINS: ${AUTH_ALLOWED_ORIGINS:-http://localhost:8088,http://127.0.0.1:8088}
      AUTH_MAIL_KEY: ${AUTH_MAIL_KEY:?Run node tools/init-local-env.mjs first}
      IDENTITY_INTERNAL_AUTH_ENABLED: "true"
      IDENTITY_INTERNAL_ALLOW_HTTP: "true"
      IDENTITY_GAME_SERVICE_KEY: ${IDENTITY_GAME_SERVICE_KEY:?Run node tools/init-local-env.mjs first}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_STARTTLS: "false"
    depends_on:
      mailpit:
        condition: service_started

  game-service:
    environment:
      GAME_AUTH_ENABLED: "true"
      GAME_AUTH_ALLOW_HTTP: "true"
      AUTH_COOKIE_SECURE: "false"
      AUTH_ALLOWED_ORIGINS: ${AUTH_ALLOWED_ORIGINS:-http://localhost:8088,http://127.0.0.1:8088}
      IDENTITY_INTERNAL_URL: http://identity-service:8081
      IDENTITY_GAME_SERVICE_KEY: ${IDENTITY_GAME_SERVICE_KEY:?Run node tools/init-local-env.mjs first}
    depends_on:
      identity-service:
        condition: service_started

  mailpit:
    image: axllent/mailpit:v1.27.8
    command: [--smtp-disable-rdns]
    ports:
      - "127.0.0.1:${MAILPIT_WEB_PORT:-28025}:8025"
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-21025}:1025"
